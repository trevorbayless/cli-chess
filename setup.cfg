[metadata]
long_description = file: README.md
long_description_content_type = text/markdown
keywords = chess, terminal, fairy-stockfish, stockfish, lichess, lichess.org, cli, san, uci
license_files = LICENSE
classifiers =
    License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)
    Operating System :: POSIX :: Linux
    Operating System :: Microsoft :: Windows
    Operating System :: MacOS
    Environment :: Console
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Topic :: Games/Entertainment :: Board Games
    Topic :: Games/Entertainment :: Turn Based Strategy
    Intended Audience :: End Users/Desktop
    Intended Audience :: Developers
    Natural Language :: English

[options]
packages = find:
package_dir = = src
python_requires = >= 3.10
include_package_data = True
zip_safe = False

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    cli-chess = cli_chess.__main__:main

[flake8]
max-line-length = 150
per-file-ignores =
    */__init__.py: F401

[tool:pytest]
filterwarnings =
    ; Note - ignore needed here due to https://github.com/niklasf/python-chess/issues/1170
    ; this ignore can be removed once python-chess releases a new version (current = 1.11.2)
    ignore:'asyncio.DefaultEventLoopPolicy' is deprecated:DeprecationWarning
    error
addopts = --disable-socket
