name: Build AppImage

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AppImage builder
        run: python -m pip install "appimage==2.0.1"

      - name: Build AppImage
        run: python -m appimage.build --python 3.11

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-chess-AppImage
          path: dist/*.AppImage

      - name: Upload AppImage to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
